# Development only: 4 sensor conditions x 2 methods x 3 shapes x 2 seeds = 48 runs.
# The mismatch command sets sensor conditions; thresholds match the reliability study.
[experiment]
policy = "cost"
touches = 128
initial = 8
candidates = 256
integration_points = 128
evaluation_points = 2048
noise_std = 0.005
seed = 3000

[model]
learn_hyperparameters = true
mean = 0.525
signal_std = 0.2
length_scale = 0.4
signal_bounds = [0.05, 0.4]
length_bounds = [0.08, 1.2]

[stopping]
mode = "guarded"
half_width = 0.02
min_touches = 24
max_gap_degrees = 15
audit_touches = 2
innovation_limit = 2.5
